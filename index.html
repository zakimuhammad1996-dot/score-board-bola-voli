<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
SEKARDANGAN CUP VOLLEYBALL SCOREBOARD V6
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>


<div class="match-screen">



<!-- ================= HEADER ================= -->


<header>


<div class="title-area">

<h1>
SEKARDANGAN CUP
</h1>


<h2>
VOLI KEBER PRIA
</h2>


<p>
DALAM RANGKA HUT KE-81 KEMERDEKAAN REPUBLIK INDONESIA
</p>


</div>





<div class="clock-area">


<div class="clock-box">

<span>
JAM
</span>

<strong id="clock">
00:00:00
</strong>

</div>



<div class="clock-box">

<span>
MATCH TIME
</span>

<strong id="timer">
00:00:00
</strong>

</div>


</div>


</header>







<!-- ================= SETTING ================= -->


<section class="setting-panel">



<div class="setting-box">


<label>
BEST OF SET
</label>


<select id="bestOf">

<option value="1">
BEST OF 1
</option>


<option value="3" selected>
BEST OF 3
</option>


<option value="5">
BEST OF 5
</option>


</select>


</div>





<div class="setting-box">


<label>
POINT / SET
</label>


<input 
type="number"
id="pointTarget"
value="25"
>


</div>





<div class="setting-box">


<label>
DEUCE
</label>


<select id="deuce">


<option value="yes">
AKTIF
</option>


<option value="no">
NON AKTIF
</option>


</select>


</div>



</section>









<!-- ================= SCORE AREA ================= -->


<section class="score-container">





<!-- TEAM KIRI -->


<div class="team-box red-team">


<input
id="teamLeft"
value="TIM MERAH"
>


<div class="score-number"
id="scoreLeft">

0

</div>




<div class="serve-indicator"
id="serveLeft">

● SERVIS

</div>



<div class="button-group">

<button onclick="addPoint('left')">

+ POINT

</button>


<button onclick="minusPoint('left')">

−

</button>


</div>


</div>










<!-- CENTER PANEL -->


<div class="center-box">


<h2>
HASIL PERTANDINGAN
</h2>



<div class="set-display">


<span id="setLeft">

0

</span>


-

<span id="setRight">

0

</span>


</div>




<h1 id="currentSet">

SET 1

</h1>





<div id="status">

NORMAL PLAY

</div>






<!-- MATRIX SCORE -->

<table 
id="historyTable"
class="history-table">


</table>





</div>









<!-- TEAM KANAN -->



<div class="team-box blue-team">



<input
id="teamRight"
value="TIM PUTIH"
>



<div class="score-number"
id="scoreRight">

0

</div>





<div class="serve-indicator"
id="serveRight">

● SERVIS

</div>





<div class="button-group">


<button onclick="addPoint('right')">

+ POINT

</button>


<button onclick="minusPoint('right')">

−

</button>



</div>


</div>







</section>









<!-- ================= CONTROL ================= -->



<section class="control-panel">


<button onclick="switchSide()">

🔄 TUKAR POSISI

</button>



<button onclick="resetMatch()">

⟳ RESET

</button>



<button onclick="fullscreen()">

⛶ FULL SCREEN

</button>



</section>







<footer>

← Point Kiri
|
→ Point Kanan
|
F Fullscreen
|
R Reset


</footer>



</div>







<script src="app.js"></script>



</body>


</html>
